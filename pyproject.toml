[project]
name = "industrial-twin-x"
version = "0.1.0"
description = "Software-simulated industrial IoT digital twin with predictive maintenance, anomaly detection, autonomous fault recovery and cyber-resilient industrial operations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "fastapi",
    "joblib",
    "matplotlib",
    "numpy",
    "paho-mqtt>=2",
    "pandas",
    "psutil",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings",
    "scikit-learn",
    "scipy",
    "simpy",
    "sqlalchemy>=2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["httpx", "mypy", "pandas-stubs", "pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulation", "modules", "research", "apps/api/twinx_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the Docker Compose services running"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["simulation", "modules", "research", "twinx_api"]
mypy_path = "apps/api"
explicit_package_bases = true
